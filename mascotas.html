<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Mascotas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="index.html">Veterinaria Ojeto</a>
            <div class="collapse navbar-collapse">
                <ul class="navbar-nav">
                    <li class="nav-item"><a class="nav-link active" href="mascotas.html">Mascotas</a></li>
                    <li class="nav-item"><a class="nav-link" href="veterinarios.html">Veterinarios</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <h2 class="mb-4">Gestión de Mascotas</h2>
        <div class="row">
            <!-- Formulario -->
            <div class="col-md-4 mb-4">
                <div class="card">
                    <div class="card-header bg-primary text-white">Registrar / Editar Mascota</div>
                    <div class="card-body">
                        <form id="formularioMascota">
                            <input type="hidden" id="idMascota">
                            <div class="mb-3">
                                <label class="form-label">Nombre de Mascota</label>
                                <input type="text" class="form-control" id="nombreMascota" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Nombre del Dueño</label>
                                <input type="text" class="form-control" id="nombreDuenio" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Color</label>
                                <input type="text" class="form-control" id="color" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Edad (años)</label>
                                <input type="number" class="form-control" id="edad" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Peso (kg)</label>
                                <input type="number" step="0.1" class="form-control" id="peso" required>
                            </div>
                            <button type="submit" class="btn btn-primary w-100">Guardar Mascota</button>
                            <button type="button" id="botonCancelar" class="btn btn-secondary w-100 mt-2 d-none">Cancelar Edición</button>
                        </form>
                    </div>
                </div>
            </div>

            <!-- Tabla -->
            <div class="col-md-8">
                <div class="d-flex justify-content-between align-items-center mb-2">
                    <h4>Lista de Mascotas</h4>
                    <span class="badge bg-info text-dark fs-6">Total: <span id="totalMascotas">0</span></span>
                </div>
                <div class="table-responsive">
                    <table class="table table-striped table-hover border">
                        <thead class="table-dark">
                            <tr>
                                <th>Nombre</th>
                                <th>Dueño</th>
                                <th>Color</th>
                                <th>Edad</th>
                                <th>Peso</th>
                                <th>Acciones</th>
                            </tr>
                        </thead>
                        <tbody id="tablaMascotas">
                            <!-- Los datos se cargan desde JS -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- Vinculamos el JS mascotas -->
    <script src="js/mascotas.js"></script>
</body>
</html>
