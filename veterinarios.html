<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Veterinarios</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="index.html">Veterinaria Ojeto</a>
            <div class="collapse navbar-collapse">
                <ul class="navbar-nav">
                    <li class="nav-item"><a class="nav-link" href="mascotas.html">Mascotas</a></li>
                    <li class="nav-item"><a class="nav-link active" href="veterinarios.html">Veterinarios</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <h2 class="mb-4">Gestión de Veterinarios</h2>
        <div class="row">
            <!-- Formulario -->
            <div class="col-md-4 mb-4">
                <div class="card">
                    <div class="card-header bg-success text-white">Registrar / Editar Veterinario</div>
                    <div class="card-body">
                        <form id="formularioVeterinario">
                            <input type="hidden" id="idVeterinario">
                            <div class="mb-3">
                                <label class="form-label">Matrícula</label>
                                <input type="number" class="form-control" id="matricula" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Nombre Completo</label>
                                <input type="text" class="form-control" id="nombre" required>
                            </div>
                            <div class="mb-3">
                                <!-- Opcional: Lista de opciones predefinidas cumplido -->
                                <label class="form-label">Especialización</label>
                                <select class="form-select" id="especializacion" required>
                                    <option value="">Seleccione...</option>
                                    <option value="Clínica General">Clínica General</option>
                                    <option value="Cirugía">Cirugía</option>
                                    <option value="Dermatología">Dermatología</option>
                                    <option value="Cardiología">Cardiología</option>
                                </select>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Valor de Consulta ($)</label>
                                <input type="number" step="0.01" class="form-control" id="valorConsulta" required>
                            </div>
                            <button type="submit" class="btn btn-success w-100">Guardar Veterinario</button>
                            <button type="button" id="botonCancelarVeterinario" class="btn btn-secondary w-100 mt-2 d-none">Cancelar Edición</button>
                        </form>
                    </div>
                </div>
            </div>

            <!-- Tabla -->
            <div class="col-md-8">
                <div class="table-responsive">
                    <table class="table table-striped table-hover border">
                        <thead class="table-dark">
                            <tr>
                                <th>Matrícula</th>
                                <th>Nombre</th>
                                <th>Especialización</th>
                                <th>Valor Consulta</th>
                                <th>Acciones</th>
                            </tr>
                        </thead>
                        <tbody id="tablaVeterinarios">
                            <!-- Los datos se cargan desde JS -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- Vinculamos el JS externo -->
    <script src="js/veterinarios.js"></script>
</body>
</html>
